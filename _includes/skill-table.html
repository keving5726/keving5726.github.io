<table>
  <thead>
    <tr>
      <th>Name</th>
      <th>Level</th>
    </tr>
  </thead>
  <tbody>
    {% assign items = include.skill.skills | default: include.skill %}
    {% for item in items %}
      <tr>
        <td>{{ item.name }}</td>
        <td>
          <span class="skill-level {{ item.level | downcase }}">{{ item.level }}</span>
        </td>
      </tr>
    {% endfor %}
  </tbody>
</table>
