<div class="skills-table-wrapper">
  <table class="skills-table">
    <thead>
      <tr>
        <th class="col-tech">Name</th>
        <th class="col-level">Level</th>
      </tr>
    </thead>
    <tbody>
      {% assign items = include.skill.skills | default: include.skill %}
      {% for item in items %}
        <tr>
          <td class="tech-cell">{{ item.name }}</td>
          <td class="level-cell">
            <span class="skill-level {{ item.level | downcase }}">{{ item.level }}</span>
          </td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
